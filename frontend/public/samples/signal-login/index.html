<script>
(function(){
  "use strict";
  var REF_W=1464, REF_H=949, PHOTO_W=836, PANE_W=628, CARD_W=613, CARD_H=922;
  var CONTENT_H=697;
  var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
  var PANE_RATIO=PANE_W/REF_W;
  var HERO_W=681, HERO_H=219;
  var REF_CARD_ASPECT=692/855;
  var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;
  var RAMP_LO2=820, PHOTO_MIN2=0.36;
  var TP={"pad":0.1076,"h1Top":0.08656,"h1Fs":0.06839,"subTop":0.17368,"subFs":0.0309,"emTop":0.25435,"emH":0.10257,"emR":0.0202,"ephFs":0.02702,"ephPad":0.0332,"pwTop":0.36851,"pwH":0.10839,"btnTop":0.50435,"btnH":0.10981,"btnFs":0.0275,"arrow":0.026,"btnGap":0.02,"divTop":0.68222,"orFs":0.02245,"orPad":0.051,"divH":0.0026,"gTop":0.76445,"gH":0.09966,"gIcon":0.032,"gtFs":0.03205,"gGap":0.026,"btTop":0.89668,"btFs":0.02876,"badgeH":0.0742,"heroLh":1.1246,"heroBot":0.06493,"heroGap":-0.30423,"heroSide":0.0525};

  var stage=document.querySelector('.stage');
  var photo=document.querySelector('.photo');
  var pane=document.querySelector('.pane');
  var card=document.getElementById('card');
  var cardIn=document.getElementById('cardIn');
  var hero=document.getElementById('hero');
  var hlWrap=document.getElementById('hlWrap');
  var hl1=document.getElementById('hl1');
  var body=document.body;

  var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

  function clearInline(){
    [photo,pane,card,cardIn,hero].forEach(function(el){ el.style.cssText=''; });
  }

  function kebab(k){ return k.replace(/[A-Z]/g,function(m){ return '-'+m.toLowerCase(); }); }

  function photoRatio(vw){
    var base=1-PANE_RATIO;
    if(vw>=RAMP_HI) return base;
    if(vw>=RAMP_LO){
      var t=(vw-RAMP_LO)/(RAMP_HI-RAMP_LO);
      return PHOTO_MIN+(base-PHOTO_MIN)*t;
    }
    if(vw>=RAMP_LO2){
      var t2=(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2);
      return PHOTO_MIN2+(PHOTO_MIN-PHOTO_MIN2)*t2;
    }
    return PHOTO_MIN2;
  }

  function placeCard(paneW, vh){
    var cs=Math.min(paneW/PANE_W, vh/CONTENT_H);
    var gapL=1*cs, mT=14*cs, mB=13*cs, mR=14*cs;
    var cw=Math.max(CARD_W*cs, paneW-gapL-mR);
    var ch=vh-mT-mB;
    card.style.left=gapL+'px';
    card.style.top=mT+'px';
    card.style.width=cw+'px';
    card.style.height=ch+'px';
    card.style.borderRadius=(26*cs)+'px';
    card.style.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
    return cs;
  }

  function seatHero(photoW, vh){
    var bandH=vh;
    var imgScale=Math.max(photoW/IMG_W, bandH/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE, photoW*0.92/HERO_W);
    hero.style.transform='scale('+s+')';
  }

  function layoutLand(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var ratio=photoRatio(vw);
    var photoW=vw*ratio;
    photo.style.width=photoW+'px';
    pane.style.left=photoW+'px';
    var paneW=vw-photoW;
    placeCard(paneW, vh);
    seatHero(photoW, vh);
  }

  function headlineMeasure(){
    var span=document.createElement('span');
    var cs=getComputedStyle(hl1);
    span.style.position='absolute';
    span.style.visibility='hidden';
    span.style.whiteSpace='nowrap';
    span.style.left='-9999px';
    span.style.top='0';
    span.style.fontFamily=cs.fontFamily;
    span.style.fontSize=cs.fontSize;
    span.style.fontWeight=cs.fontWeight;
    span.style.letterSpacing=cs.letterSpacing;
    span.style.wordSpacing=cs.wordSpacing;
    span.style.fontVariationSettings=cs.fontVariationSettings || getComputedStyle(hl1).getPropertyValue('font-variation-settings');
    span.textContent='Find Signal to Action Instantly';
    document.body.appendChild(span);
    var w=span.getBoundingClientRect().width;
    document.body.removeChild(span);
    return w;
  }

  function layoutTabport(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var bandH=Math.round(vh*0.425);
    var side=Math.round(vw*0.0525);
    var footer=Math.round(vh*0.0297);
    photo.style.setProperty('--band-h', bandH+'px');
    pane.style.setProperty('--band-h', bandH+'px');
    hero.style.setProperty('--band-h', bandH+'px');
    hero.style.setProperty('--tp-side', side+'px');
    hero.style.setProperty('--tp-hero-b', footer+'px');
    var badgeK=(bandH*TP.badgeH)/37;
    body.style.setProperty('--badge-k', badgeK);
    var heroFs=bandH*TP.heroLh*0.09;
    body.style.setProperty('--tp-hero-fs', heroFs+'px');
    body.style.setProperty('--tp-hero-lh', TP.heroLh);
    body.style.setProperty('--tp-hero-gap', (bandH*TP.heroGap*0.09)+'px');

    var cardW=vw, cardH=vh-bandH;
    var S=Math.min(cardH, cardW*REF_CARD_ASPECT);
    for(var key in TP){
      if(!TP.hasOwnProperty(key)) continue;
      var basis;
      if(key==='pad'||key==='orPad') basis=cardW;
      else if(key==='heroLh'||key==='heroBot'||key==='heroGap'||key==='heroSide'||key==='badgeH') continue;
      else if(/Top$|H$/.test(key) && key!=='btnGap') basis=cardH;
      else basis=S;
      var val=TP[key]*basis;
      body.style.setProperty('--tp-'+kebab(key), val+'px');
    }
    var measure=Math.round(headlineMeasure()*0.61);
    hlWrap.style.width=measure+'px';
  }

  function layoutPhone(){
    /* intentionally empty: static flow, no measurement */
  }

  function setMode(mode){
    clearInline();
    body.classList.remove('tabport','stacked');
    if(mode==='tabport'){
      body.classList.add('tabport');
      layoutTabport();
    } else if(mode==='phone'){
      body.classList.add('stacked');
      layoutPhone();
    } else {
      layoutLand();
    }
  }

  function layout(){
    if(window.innerWidth<700){
      setMode('phone');
    } else if(mqPortrait.matches){
      setMode('tabport');
    } else {
      setMode('land');
    }
  }

  window.addEventListener('resize', layout, {passive:true});
  window.addEventListener('orientationchange', layout);
  if(mqLandscape.addEventListener){
    mqLandscape.addEventListener('change', layout);
    mqPortrait.addEventListener('change', layout);
  } else {
    mqLandscape.addListener(layout);
    mqPortrait.addListener(layout);
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(layout);
  }
  layout();
})();
</script>

<script>
(function(){
  "use strict";
  function releaseEntrance(){
    document.documentElement.classList.remove('entry-pending');
    if(window.__entryFallback){ clearTimeout(window.__entryFallback); window.__entryFallback=null; }
  }

  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || !('animate' in Element.prototype)){
    releaseEntrance();
    return;
  }

  var ease='cubic-bezier(.16,1,.3,1)';
  var softEase='cubic-bezier(.22,1,.36,1)';
  var compact=window.matchMedia('(max-width:699px)').matches;

  function el(sel){ return document.querySelector(sel); }

  var steps=[
    {t:el('.card'), delay:40, duration:820, easing:ease,
      from:{opacity:0, transform: compact?'translateY(14px)':'translateY(12px) scale(.988)'}},
    {t:el('.badge'), delay:120, duration:480, easing:softEase, from:{opacity:0, transform:'translateY(8px)'}},
    {t:el('#hl1'), delay:240, duration:760, easing:ease,
      from:{opacity:0, transform: compact?'translateY(12px)':'translateY(16px)', clipPath:'inset(100% 0 0 0)'}},
    {t:el('#hl2'), delay:330, duration:760, easing:ease,
      from:{opacity:0, transform: compact?'translateY(12px)':'translateY(16px)', clipPath:'inset(100% 0 0 0)'}},
    {t:el('#h1'), delay:470, duration:620, easing:ease, from:{opacity:0, transform:'translateY(10px)'}},
    {t:el('#sub'), delay:570, duration:560, easing:ease, from:{opacity:0, transform:'translateY(10px)'}},
    {t:el('#email'), delay:720, duration:520, easing:softEase, from:{opacity:0, transform:'translateY(8px)'}},
    {t:el('#pw'), delay:790, duration:520, easing:softEase, from:{opacity:0, transform:'translateY(8px)'}},
    {t:el('#loginBtn'), delay:930, duration:560, easing:ease, from:{opacity:0, transform:'translateY(8px)'}},
    {t:el('.divider'), delay:1060, duration:440, easing:softEase, from:{opacity:0, transform:'translateY(6px)'}},
    {t:el('#gBtn'), delay:1150, duration:540, easing:ease, from:{opacity:0, transform:'translateY(8px)'}},
    {t:el('#bottom'), delay:1260, duration:500, easing:softEase, from:{opacity:0, transform:'translateY(6px)'}}
  ];

  function start(){
    var animations=steps.map(function(s){
      var to={opacity:1, transform:'none'};
      if('clipPath' in s.from) to.clipPath='inset(0 0 0 0)';
      return s.t.animate([s.from, to], {delay:s.delay, duration:s.duration, easing:s.easing, fill:'both'});
    });
    document.documentElement.classList.remove('entry-pending');
    Promise.allSettled(animations.map(function(a){ return a.finished; })).then(function(){
      animations.forEach(function(a){ a.cancel(); });
      animations.length=0;
      releaseEntrance();
    });
  }

  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(function(r){ setTimeout(r,650); })]).then(function(){
    requestAnimationFrame(function(){ requestAnimationFrame(start); });
  });
})();
</script>
