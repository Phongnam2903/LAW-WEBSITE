# Test profile — used by `mvn test` for integration tests that need a real database.
# Points at a separate schema from local dev by convention so test runs never touch
# development data.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:lawfirm_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:lawfirm}
    password: ${DB_PASSWORD:lawfirm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:lawfirm-documents-test}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}

logging:
  level:
    com.lawfirm.backend: INFO
