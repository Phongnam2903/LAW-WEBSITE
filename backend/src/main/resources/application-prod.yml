# Production profile — every value is sourced from the environment with no default,
# so a misconfigured deployment fails to start rather than silently using a dev value.
# Production hosting/deployment target itself is undecided — see TF-OQ-010.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  # Left unset (default) so the AWS SDK resolves the real regional S3 endpoint. Only set
  # STORAGE_ENDPOINT if targeting a self-hosted S3-compatible service instead of AWS S3.
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET}
  # Left unset (default) so the AWS default credentials provider chain (e.g. IAM role) is
  # used instead of static keys — only set these for a non-AWS S3-compatible target.
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style-access: ${STORAGE_PATH_STYLE_ACCESS:false}

logging:
  level:
    com.lawfirm.backend: INFO
