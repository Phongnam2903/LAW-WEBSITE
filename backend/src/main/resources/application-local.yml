# Local development profile — used when running against Docker Compose infra
# (see docs/technical-foundation/08-docker-development.md). Defaults match that
# compose file's service credentials; override via env vars for anything else.

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:lawfirm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false
    username: ${DB_USERNAME:lawfirm}
    password: ${DB_PASSWORD:lawfirm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:lawfirm-documents}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}

logging:
  level:
    com.lawfirm.backend: DEBUG
